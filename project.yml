name: BolaDeEspuma
options:
  bundleIdPrefix: br.com.ricardomadureira
  deploymentTarget:
    iOS: "15.0"
targets:
  BolaDeEspuma:
    type: application
    platform: iOS
    sources:
      - path: BolaApp
        excludes:
          - "www/**"
      - path: BolaApp/www
        type: folder
        buildPhase: resources
    info:
      path: BolaApp/Info.plist
      properties:
        CFBundleDisplayName: Bola de Espuma
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Para escolher a Foto do Fundo."
        NSPhotoLibraryUsageDescription: "Para escolher a Foto do Fundo."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.ricardomadureira.boladeespuma
        PRODUCT_NAME: BolaDeEspuma
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 5S5LGDW32A
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Bola de Espuma AdHoc"
    scheme: {}
